name: Feature request
description: An idea for the Transora extension or the Cloud worker.
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Mockups or examples from other tools are welcome.
    validations:
      required: true
  - type: input
    id: languages
    attributes:
      label: Languages you translate between
      placeholder: e.g. English → Vietnamese
